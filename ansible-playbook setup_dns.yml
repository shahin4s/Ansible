---
- name: Setup BIND9 DNS Server for hello.net
  hosts: all
  become: yes # Run as root

  vars:
    domain_name: "shahin.at"
    # Change this to your server's actual IP address:
    server_ip: "192.168.1.50" 
    forwarder_ip: "8.8.8.8"

  tasks:
    - name: Install BIND9 and dnsutils
      apt:
        name:
          - bind9
          - dnsutils
        state: present
        update_cache: yes

    - name: Configure BIND options (Set Forwarder)
      copy:
        dest: /etc/bind/named.conf.options
        content: |
          options {
              directory "/var/cache/bind";
              
              forwarders {
                  {{ forwarder_ip }};
              };
              
              dnssec-validation auto;
              listen-on-v6 { any; };
          };
      notify: Restart BIND

    - name: Tell BIND to manage the domain
      copy:
        dest: /etc/bind/named.conf.local
        content: |
          zone "{{ domain_name }}" {
              type master;
              file "/etc/bind/db.{{ domain_name }}";
          };
      notify: Restart BIND

    - name: Create the DNS records (Zone file)
      copy:
        dest: "/etc/bind/db.{{ domain_name }}"
        content: |
          $TTL 86400
          @   IN  SOA     ns1.{{ domain_name }}. admin.{{ domain_name }}. ( 1 3600 1800 604800 86400 )
          @   IN  NS      ns1.{{ domain_name }}.
          @   IN  A       {{ server_ip }}
          ns1 IN  A       {{ server_ip }}
          www IN  A       {{ server_ip }}
      notify: Restart BIND

    - name: Ensure BIND is running and enabled on boot
      service:
        name: bind9
        state: started
        enabled: yes

  # Handlers only run if a file was actually changed above
  handlers:
    - name: Restart BIND
      service:
        name: bind9
        state: restarted
